general {
    fail_timeout = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    blur_passes = 4
    blur_size = 8
    color = 0x00000000
    path = $HOME/.cache/wallpaper.png
}

shape {
    size = 860, 4
    color = 0x00000000
    border_size = 0
    border_color = 0x00000000
    position = 0, 0
    halign = center
    valign = top
    onclick = hyprctl eval "hl.dispatch(components.osk.stop())"
}

shape {
    size = 860, 4
    color = 0x00000000
    border_size = 0
    border_color = 0x00000000
    position = 0, 0
    halign = center
    valign = bottom
    onclick = hyprctl eval "hl.dispatch(components.osk.start())"
}

input-field {
    check_color = 0x00000000
    dots_center = true
    dots_size = 0.16
    dots_spacing = 0.64    
    fade_on_empty = false
    fail_color = 0xf7f27050
    fail_text = 
    fail_transition = 0
    font_color = 0xf7f7f7f7
    font_family = Ubuntu Sans Mono
    font_size = 14
    halign = center
    hide_input = false
    inner_color = 0x00000000
    outer_color = 0x00000000
    outline_thickness = 0
    placeholder_text = 
    size = 512, 64
    valign = center
}

